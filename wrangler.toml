name = "payoutsplit"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "payoutsplit-db"
database_id = "93587ae8-698e-4fd1-891e-228252673a84"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "ecce870d0d264b00ab9091755b6bb00c"

[vars]
ENVIRONMENT = "production"

# BILLING_ENABLED is an assertion, not a switch. There is no billing,
# account, credit, API-key, checkout, or webhook code in this Worker — it
# was deleted, not disabled. This var exists so /healthz can state that
# fact externally. Setting it to "true" enables nothing.
BILLING_ENABLED = "false"

# ALLOW_QBO_EXPORT does gate real behavior. The QuickBooks journal builder
# exists and is tested, but its output has never been imported into a real
# QuickBooks company, and the parser it depends on has never been run
# against a real Stripe export. Do not set this to "true" until both of
# those are done — see the manual validation checklist in PR #5.
ALLOW_QBO_EXPORT = "false"
