name = "payoutsplit"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "payoutsplit-db"
database_id = "93587ae8-698e-4fd1-891e-228252673a84"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "ecce870d0d264b00ab9091755b6bb00c"

[vars]
ENVIRONMENT = "production"
# Non-production alpha: both flags default off. Billing must not be
# enabled, and QuickBooks journal export must not be offered, until the
# acceptance tests in the containment audit pass and a human explicitly
# flips these — see the audit's final report for the remaining blockers.
BILLING_ENABLED = "false"
ALLOW_QBO_EXPORT = "false"
