[package]
name = "rustchain-agent-economy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client for the RustChain RIP-302 Agent Economy API"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tiny_http = "0.12"
