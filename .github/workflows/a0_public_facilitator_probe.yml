name: Probe public x402 facilitators
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/probe_public_facilitators.py'
      - '.github/workflows/a0_public_facilitator_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: python tools/probe_public_facilitators.py | tee facilitator_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: facilitator-probe
          path: facilitator_probe.json
