name: swarmbrain-targeted-recruit
on:
  push:
    branches: ["swarmbrain-live-20260922"]
    paths:
      - "swarmbrain/targeted_recruit.py"
      - ".github/workflows/swarmbrain-targeted-recruit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-opt-in-invitations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send four targeted A2A invitations
        run: python swarmbrain/targeted_recruit.py
      - uses: actions/upload-artifact@v4
        with:
          name: swarmbrain-targeted-outreach
          path: swarmbrain/outreach
          retention-days: 14
