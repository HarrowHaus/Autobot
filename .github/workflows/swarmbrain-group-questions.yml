name: SwarmBrain group questions
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: 'Group JSON: ask, define, plan, or status'
        required: true
        default: '{"mode":"plan","group":"reasoning"}'
permissions:
  contents: write
concurrency:
  group: swarmbrain-peer-state
  cancel-in-progress: false
jobs:
  group-question:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'SwarmBrain group:'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      STATE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test persistent peers and nested groups
        run: python3 -m unittest discover -s tests -v
      - name: Run the requested group operation
        run: python3 swarmbrain/groups.py
      - name: Preserve group topology, questions and attributed responses
        if: always()
        run: |
          git config user.name 'SwarmBrain-Harrow'
          git config user.email '285251944+HarrowHaus@users.noreply.github.com'
          for path in data/groups.json data/group-graph.json data/mesh-state.json data/graph.json reports/group-latest.json reports/group-runs reports/task-receipts; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve nested group question, contributor paths and responses [skip ci]'
            git push origin "HEAD:${STATE_BRANCH}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swarmbrain-group-results
          path: |
            data/groups.json
            data/group-graph.json
            reports/group-latest.json
            reports/group-runs/
            reports/task-receipts/
          retention-days: 14
