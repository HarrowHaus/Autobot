name: A0 direct USDC quote

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: a0-direct-usdc-quote-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  quote:
    if: github.event.issue.number == 33 && startsWith(github.event.comment.body, 'SwarmBrain paid route:')
    runs-on: ubuntu-latest
    env:
      A0_PAY_TO: 0xa47930496923574a33325b9be28fe84fa8d2b1c6
      COMMENT_BODY: ${{ github.event.comment.body }}
      REQUESTER: ${{ github.event.comment.user.login }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create unique Base USDC quote
        run: |
          python - <<'PY'
          import json, os
          from swarmbrain.direct_usdc import create_quote
          prefix='SwarmBrain paid route:'
          body=os.environ['COMMENT_BODY']
          query=body[len(prefix):].strip()
          if not query or len(query)>1000:
              raise SystemExit('paid route query must be 1..1000 characters')
          order_id='paid-route-'+os.environ['COMMENT_ID']
          quote=create_quote(orders_dir='direct-usdc/orders',order_id=order_id,query=query,requester=os.environ['REQUESTER'],comment_id=int(os.environ['COMMENT_ID']),issue_number=int(os.environ['ISSUE_NUMBER']),pay_to=os.environ['A0_PAY_TO'])
          open('quote.json','w',encoding='utf-8').write(json.dumps(quote,indent=2)+'\n')
          PY
      - name: Persist quote receipt
        run: |
          git config user.name 'A0 Direct USDC'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct-usdc/orders
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Create direct USDC quote for comment ${COMMENT_ID} [skip ci]"
          git push
      - name: Return payment instructions
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const q=JSON.parse(fs.readFileSync('quote.json','utf8'));
            const body=[
              'A0 direct USDC quote',
              '',
              'Order: '+q.order_id,
              'Service: read-only swarm route selection',
              'Amount: '+q.amount_usdc+' USDC',
              'Network: Base mainnet (eip155:8453)',
              'Pay to: '+q.pay_to,
              'USDC contract: '+q.token_contract,
              'Quote expires after Base block '+q.expires_after_block+'.',
              '',
              'The watcher releases the result only after the exact USDC transfer is confirmed on-chain. Do not send ETH, USDbC, or a different amount.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});