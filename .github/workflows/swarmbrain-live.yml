name: swarmbrain-live
on:
  push:
    branches: ["swarmbrain-live-20260922"]
    paths:
      - "swarmbrain/**"
      - ".github/workflows/swarmbrain-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crawl-index-invite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl public registries and post one opt-in invitation
        run: python swarmbrain/live_crawl.py
      - name: Upload live index
        uses: actions/upload-artifact@v4
        with:
          name: swarmbrain-live-index
          path: swarmbrain/out
          if-no-files-found: error
          retention-days: 14
