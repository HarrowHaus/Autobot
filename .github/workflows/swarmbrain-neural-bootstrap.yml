name: Bootstrap SwarmBrain neural graph
on:
  workflow_dispatch:
  push:
    branches: ['claude/monetizable-project-concepts-b97bv2']
    paths: ['.github/workflows/swarmbrain-neural-bootstrap.yml']
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/monetizable-project-concepts-b97bv2
      - name: Install neural graph files
        env:
          ARCHIVE_B64: 
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p=pathlib.Path('/tmp/neural.tgz')
          p.write_bytes(base64.b64decode(os.environ['ARCHIVE_B64']))
          PY
          tar -xzf /tmp/neural.tgz -C .
      - name: Test and perform first real growth run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest tests.test_neural_graph -v
          python3 swarmbrain/neural_expand.py --max-cards 20
          python3 swarmbrain/neural_graph.py status
      - name: Publish code and first persistent graph
        run: |
          git config user.name 'Rook-SwarmBrain'
          git config user.email '285251944+HarrowHaus@users.noreply.github.com'
          git add -- swarmbrain/neural_graph.py swarmbrain/neural_expand.py swarmbrain/identity.json tests/test_neural_graph.py docs/NEURAL-SWARM.md data/agent-ledger.json data/agent-synapses.json reports/agent-interactions.ndjson reports/neural-growth-latest.json
          git commit -m 'Build persistent self-expanding SwarmBrain neural graph [skip ci]'
          git push origin HEAD:claude/monetizable-project-concepts-b97bv2
