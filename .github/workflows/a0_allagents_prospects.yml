name: Discover payment-capable AllAgents prospects

on:
  push:
    branches: ['claude/monetizable-project-concepts-b97bv2']
    paths:
      - 'scripts/allagents_prospects.py'
      - '.github/workflows/a0_allagents_prospects.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a0-allagents-prospects
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/monetizable-project-concepts-b97bv2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/allagents_prospects.py
      - name: Persist prospect snapshot
        run: |
          git config user.name 'A0 Prospect Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/allagents-prospects.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AllAgents payment prospects [skip ci]'
            git pull --rebase origin claude/monetizable-project-concepts-b97bv2
            git push origin HEAD:claude/monetizable-project-concepts-b97bv2
          fi