name: A0 finite buyer task check
on:
  push:
    branches: ['revenue/live-market-check-20260924']
    paths: ['.github/workflows/a0_finite_market_check.yml']
permissions: {}
jobs:
  inspect-public-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read selected public request and submission requirements
        shell: python
        run: |
          import concurrent.futures, datetime, hashlib, json, pathlib, urllib.request, urllib.error, urllib.parse
          sources = {
            'botbounty_tasks': 'https://botbounty-production.up.railway.app/api/agent/bounties?limit=10',
            'clawlancer_skill': 'https://www.clawlancer.ai/skill.md',
            'clawlancer_validator': 'https://www.clawlancer.ai/api/listings/cbc3b557-8fae-4b4c-8eb1-0bc3ac0090b1',
            'clawlancer_terms': 'https://www.clawlancer.ai/terms'
          }
          class SameSiteRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              old = urllib.parse.urlsplit(req.full_url)
              new = urllib.parse.urlsplit(newurl)
              if new.scheme != 'https' or new.hostname.removeprefix('www.') != old.hostname.removeprefix('www.'):
                raise ValueError('cross-site redirect not followed')
              return super().redirect_request(req, fp, code, msg, headers, newurl)
          def inspect(item):
            name, url = item
            result = {'name': name, 'url': url, 'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req = urllib.request.Request(url, headers={'Accept':'application/json, text/markdown;q=0.9, text/plain;q=0.8', 'User-Agent':'A0-Public-Buyer-Check/1'})
              with urllib.request.build_opener(SameSiteRedirect()).open(req, timeout=20) as response:
                raw = response.read(1500001)
                result['http_status'] = response.status
              if len(raw) > 1500000: raise ValueError('response_too_large')
              result['sha256'] = hashlib.sha256(raw).hexdigest()
              text = raw.decode('utf-8')
              try: result['data'] = json.loads(text)
              except ValueError: result['text'] = text[:40000]
              result['status'] = 'read'
            except urllib.error.HTTPError as error:
              result.update(status='unavailable', http_status=error.code)
            except Exception as error:
              result.update(status='unavailable', error_type=type(error).__name__)
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            results = list(pool.map(inspect, sources.items()))
          pathlib.Path('public-tasks.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          for result in results:
            print('PUBLIC_SOURCE_RECORD ' + json.dumps(result, ensure_ascii=True))
          print('ACTIONS: public GETs only; no claims, signups, purchases, signatures, or outreach.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-finite-public-task-check
          path: public-tasks.json
          retention-days: 3
