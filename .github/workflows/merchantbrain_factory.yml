name: MerchantBrain opportunity factory
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: merchantbrain-opportunity-factory
  cancel-in-progress: false
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merchantbrain-opportunity-factory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover, score, choose, manufacture
        run: python -m swarmbrain.opportunity_factory
      - name: Emit opportunity contract for downstream OSS factories
        run: |
          python - <<'PY'
          import json, pathlib
          p=json.load(open("reports/merchantbrain/product.json",encoding="utf-8"))
          if p.get("status")=="publishable":
              c={"id":p["slug"],"problem":p["promise"],"buyer":p["buyer"],"evidence":p["payload"]["evidence"],"product_type":"research","constraints":{"cash_budget_usd":0}}
              pathlib.Path("reports/merchantbrain/opportunity-contract.json").write_text(json.dumps(c,indent=2)+"\n")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: merchant-site
      - uses: actions/upload-artifact@v4
        with:
          name: merchantbrain-evidence
          path: reports/merchantbrain
          retention-days: 30
      - name: Persist experiment memory
        run: |
          git config user.name 'MerchantBrain'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchantbrain merchant-site
          if ! git diff --cached --quiet; then
            git commit -m 'MerchantBrain: refresh opportunity experiment [skip ci]'
            git pull --rebase origin merchantbrain-opportunity-factory
            git push origin HEAD:merchantbrain-opportunity-factory
          fi
