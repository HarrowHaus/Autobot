name: SwarmBrain BountyBook earning cycle

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swarmbrain-bountybook-earning-cycle
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOUNTYBOOK_AGENT_PRIVATE_KEY: ${{ secrets.BOUNTYBOOK_AGENT_PRIVATE_KEY }}
      BOUNTYBOOK_AGENT_ADDRESS: ${{ secrets.BOUNTYBOOK_AGENT_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install commerce SDKs
        run: npm install --ignore-scripts

      - name: Scan live BountyBook work
        run: |
          mkdir -p reports/commerce
          npm --silent run scan:bountybook > reports/commerce/bountybook-latest.json
          cat reports/commerce/bountybook-latest.json

      - name: Pre-fulfill and independently verify one candidate
        run: |
          if [ -z "$BOUNTYBOOK_AGENT_PRIVATE_KEY" ]; then
            rm -f reports/commerce/bountybook-earn-plan.json
            printf '%s\n' '{"status":"blocked","reason":"bountybook_worker_secret_missing"}' > reports/commerce/bountybook-earn-preflight.json
            exit 0
          fi
          python -m swarmbrain.earning_cycle             --basedagents reports/commerce/bountybook-latest.json             --plan reports/commerce/bountybook-earn-plan.json             --result reports/commerce/bountybook-earn-preflight.json
          cat reports/commerce/bountybook-earn-preflight.json

      - name: Claim and submit verified work
        run: |
          if [ -f reports/commerce/bountybook-earn-plan.json ]; then
            node commerce/bountybook_earn.mjs reports/commerce/bountybook-earn-plan.json > reports/commerce/bountybook-earn-execution.json
          elif grep -q '"reason":"bountybook_worker_secret_missing"' reports/commerce/bountybook-earn-preflight.json 2>/dev/null; then
            cp reports/commerce/bountybook-earn-preflight.json reports/commerce/bountybook-earn-execution.json
          else
            printf '%s\n' '{"status":"not_executed","reason":"no_verified_prefulfilled_plan"}' > reports/commerce/bountybook-earn-execution.json
          fi
          cat reports/commerce/bountybook-earn-execution.json

      - name: Remove private/pre-claim plan
        if: always()
        run: rm -f reports/commerce/bountybook-earn-plan.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarmbrain-bountybook-earning-cycle
          path: |
            reports/commerce/bountybook-latest.json
            reports/commerce/bountybook-earn-preflight.json
            reports/commerce/bountybook-earn-execution.json
            reports/task-receipts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist public-safe receipts on operational branch
        run: |
          if [ "$GITHUB_REF_NAME" != "claude/monetizable-project-concepts-b97bv2" ]; then
            echo "Not the operational branch; artifact-only run."
            exit 0
          fi
          git config user.name 'SwarmBrain Commerce'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mesh-state.json data/graph.json reports/task-receipts reports/commerce/bountybook-latest.json reports/commerce/bountybook-earn-preflight.json reports/commerce/bountybook-earn-execution.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist BountyBook earning-cycle receipts [skip ci]'
            git pull --rebase origin claude/monetizable-project-concepts-b97bv2
            git push origin HEAD:claude/monetizable-project-concepts-b97bv2
          fi
