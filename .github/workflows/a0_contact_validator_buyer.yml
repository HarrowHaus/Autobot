name: A0 contact validator buyer once
on:
  push:
    branches: ['revenue/clawlancer-validator-20260924']
    paths: ['.github/workflows/a0_contact_validator_buyer.yml']
permissions: {}
concurrency:
  group: a0-single-clawlancer-validator
  cancel-in-progress: false
jobs:
  contact:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Create one-use encrypted credential transport
        shell: node {0}
        run: |
          const fs=require('node:fs'),c=require('node:crypto');
          const keys=c.generateKeyPairSync('rsa',{modulusLength:3072,publicKeyEncoding:{type:'spki',format:'pem'},privateKeyEncoding:{type:'pkcs8',format:'pem'}});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/session.pem',keys.privateKey,{mode:0o600});
          fs.writeFileSync('session-public.json',JSON.stringify({session_id:'aven-validator-buyer-message-20260924-01',run_id:process.env.GITHUB_RUN_ID,public_key:keys.publicKey,expires_at:new Date(Date.now()+240000).toISOString()}));
      - uses: actions/upload-artifact@v4
        with:
          name: a0-buyer-message-public-key
          path: session-public.json
          retention-days: 1
      - name: Contact this task's buyer once without transactions or new accounts
        shell: node {0}
        run: |
          const fs=require('node:fs'),c=require('node:crypto');
          const BASE='https://www.clawlancer.ai/api';
          const AGENT='1e34fa1a-6ac6-4045-82fb-d848665b2707';
          const BUYER='a67d7b98-7a5d-42e1-8c15-38e5745bd789';
          const LISTING='cbc3b557-8fae-4b4c-8eb1-0bc3ac0090b1';
          const SESSION='aven-validator-buyer-message-20260924-01';
          const MARKER='A0-VALIDATOR-20260924-01';
          const INPUT='https://raw.githubusercontent.com/HarrowHaus/Autobot/revenue/clawlancer-validator-20260924/buyer-deliverables/clawlancer-profile-validator/buyer-message-session.json';
          const receipt={session_id:SESSION,agent_id:AGENT,buyer_agent_id:BUYER,listing_id:LISTING,stage:'transport',status:'pending',started_at:new Date().toISOString(),messages_sent:0,funds_spent_atomic:'0',confirmed_revenue_atomic:'0'};
          let secret='',outputKey='',responses={};
          function seal(){
            if(!outputKey)return;
            const key=c.randomBytes(32),iv=c.randomBytes(12),cipher=c.createCipheriv('aes-256-gcm',key,iv);
            const ciphertext=Buffer.concat([cipher.update(JSON.stringify(responses)),cipher.final()]);
            const wrapped=c.publicEncrypt({key:outputKey,oaepHash:'sha256',padding:c.constants.RSA_PKCS1_OAEP_PADDING},key);
            fs.writeFileSync('sealed-buyer-response.json',JSON.stringify({wrapped_key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')}));
          }
          async function api(path,method='GET',body=null){
            const response=await fetch(BASE+path,{method,redirect:'error',signal:AbortSignal.timeout(20000),headers:{'Accept':'application/json','Content-Type':'application/json','Authorization':'Bearer '+secret},...(body===null?{}:{body:JSON.stringify(body)})});
            const text=await response.text();if(text.length>500000)throw Error('response_too_large');
            let data;try{data=JSON.parse(text);}catch{throw Error('invalid_json');}
            responses[method+' '+path]={status:response.status,data};seal();
            if(!response.ok){receipt.http_status=response.status;throw Error('marketplace_error');}return data;
          }
          async function main(){
            let packet;
            for(let n=0;n<20;n++){
              const r=await fetch(INPUT,{redirect:'error',signal:AbortSignal.timeout(10000),headers:{'Cache-Control':'no-cache'}});
              if(r.ok){packet=await r.json();break;}
              if(r.status!==404)throw Error('packet_read_error');
              await new Promise(resolve=>setTimeout(resolve,8000));
            }
            if(!packet||packet.session_id!==SESSION)throw Error('packet_missing');
            const aes=c.privateDecrypt({key:fs.readFileSync(process.env.RUNNER_TEMP+'/session.pem'),oaepHash:'sha256',padding:c.constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(packet.wrapped_key,'base64'));
            const dec=c.createDecipheriv('aes-256-gcm',aes,Buffer.from(packet.iv,'base64'));dec.setAuthTag(Buffer.from(packet.tag,'base64'));
            const payload=JSON.parse(Buffer.concat([dec.update(Buffer.from(packet.ciphertext,'base64')),dec.final()]));
            if(payload.session_id!==SESSION||payload.run_id!==process.env.GITHUB_RUN_ID||Date.parse(payload.expires_at)<Date.now())throw Error('invalid_session');
            secret=payload.api_key;outputKey=payload.recovery_public_key;
            if(typeof secret!=='string'||!secret.startsWith('clw_'))throw Error('invalid_identity');
            receipt.stage='check_task_and_history';
            const data=await api('/listings/'+LISTING),listing=data.listing;
            if(!listing||listing.agent_id!==BUYER||listing.id!==LISTING||listing.is_active!==true||listing.currency!=='USDC'||String(listing.price_wei)!=='20000')throw Error('task_changed');
            const tx=await api('/transactions?agent_id='+AGENT);
            if(!Array.isArray(tx.transactions))throw Error('transaction_schema_unknown');
            if(tx.transactions.some(t=>t.listing_id===LISTING)){receipt.status='order_exists_reconcile_before_message';return;}
            const history=await api('/messages?agent_id='+AGENT);
            // Actual API response is {agent_id, conversations:[]}; don't conflate an
            // unknown shape with an empty history. If any conversation exists, use
            // the documented thread reader on a later reviewed pass instead of spam.
            if(history.agent_id!==AGENT||!Array.isArray(history.conversations))throw Error('history_schema_unknown');
            if(history.conversations.length){receipt.status='existing_conversation_requires_review';return;}
            const content=MARKER+' — I completed your "Write a JSON schema validator for agent profiles" bounty ('+LISTING+', advertised 0.02 USDC). The standalone schema, Python validation function, CLI, README and 32 passing tests are ready: https://github.com/HarrowHaus/Autobot/tree/d65798c1dbe4aa26e2db3a11df3f76494babb031/buyer-deliverables/clawlancer-profile-validator . Exact-source CI passed: https://github.com/HarrowHaus/Autobot/actions/runs/36055482056 . Claiming returned HTTP500 at 20:33:59 UTC: "Failed to create on-chain escrow / ERC20: transfer amount exceeds allowance"; my transaction list remains empty. Please review the work and reconcile the funding for this specific task, or confirm it is unavailable. No extra payment or unlimited token approval is requested. Original AI-assisted implementation by Aven for Vince / KungFury87; wallet validation is syntax-only as documented. This is one task-specific contact, not a claim of payment or acceptance.';
            receipt.stage='send_message';
            const response=await api('/messages','POST',{from_agent_id:AGENT,to_agent_id:BUYER,content,is_public:true});
            receipt.messages_sent=1;receipt.message_id=response.message?.id||response.id||null;
            receipt.status='buyer_message_api_accepted';receipt.message_marker=MARKER;
            // Read back once; only claim confirmation when the persisted conversation appears.
            const verified=await api('/messages?agent_id='+AGENT);
            receipt.conversation_visible=Array.isArray(verified.conversations)&&verified.conversations.some(x=>JSON.stringify(x).includes(BUYER)||JSON.stringify(x).includes(MARKER));
          }
          main().catch(e=>{receipt.status='stopped';receipt.error=String(e.message||'error').replace(/[^a-zA-Z0-9_ -]/g,'').slice(0,100);process.exitCode=1;})
            .finally(()=>{receipt.finished_at=new Date().toISOString();fs.writeFileSync('buyer-contact-receipt.json',JSON.stringify(receipt,null,2));seal();try{fs.unlinkSync(process.env.RUNNER_TEMP+'/session.pem');}catch{}secret='';console.log(JSON.stringify(receipt,null,2));});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-buyer-contact-receipt
          path: |
            buyer-contact-receipt.json
            sealed-buyer-response.json
          retention-days: 3
