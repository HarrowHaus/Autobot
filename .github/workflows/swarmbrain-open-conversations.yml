name: SwarmBrain open conversations
on:
  push:
    branches: ['swarmbrain/open-conversations-20260923']
    paths: ['.github/workflows/swarmbrain-open-conversations.yml']
permissions:
  contents: write
concurrency:
  group: swarmbrain-open-conversations-20260923
  cancel-in-progress: false
jobs:
  public-conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Send reviewed replies once and preserve public receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 swarmbrain/open_conversations_once.py
