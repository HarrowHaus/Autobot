name: Test Cloudflare merchant and commerce adapters
on:
  push:
    paths:
      - 'cloudflare/**'
      - 'commerce/**'
      - 'swarmbrain/commercial_controller.py'
      - 'tests/test_cloudflare_merchant.mjs'
      - 'tests/test_commerce_scans.mjs'
      - 'tests/test_commercial_controller.py'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/a0_cloudflare_merchant_test.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'commerce/**'
      - 'swarmbrain/commercial_controller.py'
      - 'tests/test_cloudflare_merchant.mjs'
      - 'tests/test_commerce_scans.mjs'
      - 'tests/test_commercial_controller.py'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/a0_cloudflare_merchant_test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npm run test:worker
      - run: npm run test:commerce
      - run: python -m unittest tests.test_commercial_controller tests.test_earning_cycle
      - run: npx wrangler deploy --dry-run
