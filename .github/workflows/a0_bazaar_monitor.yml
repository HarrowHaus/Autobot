name: A0 x402 Bazaar discovery monitor

on:
  push:
    branches: ['claude/monetizable-project-concepts-b97bv2']
    paths:
      - '.github/workflows/a0_bazaar_monitor.yml'
      - 'commerce/bazaar_scan.mjs'
      - 'cloudflare/merchant-worker.js'
      - 'package.json'
      - 'wrangler.jsonc'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a0-bazaar-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/monetizable-project-concepts-b97bv2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official commerce SDKs
        run: npm install --ignore-scripts
      - name: Query Bazaar through the official x402 client
        run: |
          mkdir -p reports
          npm run scan:bazaar > reports/bazaar-discovery.json
          cat reports/bazaar-discovery.json
      - name: Persist discovery status
        run: |
          git config user.name 'A0 Bazaar Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/bazaar-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update x402 Bazaar discovery status [skip ci]'
            git pull --rebase origin claude/monetizable-project-concepts-b97bv2
            git push origin HEAD:claude/monetizable-project-concepts-b97bv2
          fi
