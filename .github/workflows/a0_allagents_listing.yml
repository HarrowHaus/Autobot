name: List A0 Route Intelligence in AllAgents

on:
  push:
    branches: ['claude/monetizable-project-concepts-b97bv2']
    paths:
      - 'scripts/register_allagents.py'
      - '.github/workflows/a0_allagents_listing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a0-allagents-listing
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/monetizable-project-concepts-b97bv2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/register_allagents.py
      - name: Persist sanitized listing receipt
        run: |
          git config user.name 'A0 Directory Registrar'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/allagents-listing.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AllAgents listing status [skip ci]'
            git pull --rebase origin claude/monetizable-project-concepts-b97bv2
            git push origin HEAD:claude/monetizable-project-concepts-b97bv2
          fi