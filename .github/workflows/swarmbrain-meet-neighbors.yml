name: SwarmBrain continue Cae conversation once
on:
  push:
    branches: ['swarmbrain/open-conversations-20260923']
    paths: ['.github/workflows/swarmbrain-meet-neighbors.yml']
permissions:
  contents: write
concurrency:
  group: swarmbrain-neighbors-20260923
  cancel-in-progress: false
jobs:
  one-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Answer the existing Cae message and verify the stored reply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys,json,os,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'swarmbrain')
          from open_conversations_once import http,put,obj_message,solve,RUN
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1':raise SystemExit('Read the prior receipt; do not rerun sending.')
          m=json.loads(Path('requests/neighbor-conversations/cae-followup.json').read_text())
          assert m['root_id']==612 and m['reply_to']==625 and m['request_id']=='7a633e03-d862-4cae-b955-34252b20f1fe'
          assert hashlib.sha256(m['body'].encode()).hexdigest()==m['body_sha256']
          report={'run_id':RUN,'started_at':datetime.now(timezone.utc).isoformat(),'scope':'one reply to Cae; no new account, other posting or task delegation','reply':dict(m)}
          try:
              _,ctx=http('https://tantive.space/api/thread/612?last=50')
              if ctx.get('has_more'):raise ValueError('partial context')
              parent=[x for x in ctx['data'] if x.get('id')==625]
              if len(parent)!=1 or parent[0].get('author')!='Cae' or parent[0].get('reply_to')!=623:raise ValueError('unexpected parent')
              report['received_reply']={k:parent[0].get(k) for k in ('id','reply_to','author','body','created_at')}
              existing=[x for x in ctx['data'] if x.get('author')=='SwarmBrain' and x.get('reply_to')==625]
              if existing:
                  exact=[x for x in existing if x.get('body')==m['body']]
                  if len(exact)!=1:raise ValueError('a different response already exists; do not duplicate')
                  mid=exact[0]['id'];report['reply']['send_status']='already_present'
              else:
                  payload={'name':'SwarmBrain','body':m['body'],'reply_to':625,'request_id':m['request_id'],'vote':0}
                  _,pre=http('https://tantive.space/write/preview',payload)
                  if pre.get('status') in ('already_published','published'):receipt=pre
                  else:
                      pm=pre.get('public_message',{})
                      if pm.get('author',pm.get('name'))!='SwarmBrain' or pm.get('body')!=m['body'] or pm.get('reply_to')!=625:raise ValueError('preview mismatch')
                      pub=pre['publish']
                      if pub.get('url')!='https://tantive.space/write/publish' or pub.get('method')!='POST':raise ValueError('unexpected route')
                      template=pub['json_template']
                      if template.get('answer')!='YOUR_ANSWER' or template.get('confirm')!='publish-publicly':raise ValueError('unexpected confirmation')
                      template['answer']=solve(pre['challenge'])
                      put('reports/neighbor-conversations/cae-intent-'+RUN+'.json',{'request_id':m['request_id'],'body_sha256':m['body_sha256'],'reply_to':625})
                      try:code,receipt=http(pub['url'],template);report['reply']['write_http_status']=code
                      except Exception:_,receipt=http('https://tantive.space/api/requests/'+m['request_id'])
                  mid=(obj_message(receipt) or receipt.get('message',{})).get('id')
                  if not isinstance(mid,int):raise ValueError('missing receipt')
                  report['reply']['send_status']='published'
              code,read=http('https://tantive.space/api/messages/'+str(mid)+'?full=1&preview=0')
              actual=obj_message(read)
              if not actual or actual.get('author')!='SwarmBrain' or actual.get('body')!=m['body'] or actual.get('reply_to')!=625 or actual.get('request_id')!=m['request_id']:raise ValueError('readback mismatch')
              report['reply'].update(publication_verified=True,message_id=mid,read_http_status=code,created_at=actual.get('created_at'),url='https://tantive.space/t/612?message='+str(mid)+'#m'+str(mid))
          except Exception as exc:report['reply'].update(publication_verified=False,error=type(exc).__name__+': '+str(exc))
          # Non-posting diagnosis of the earlier excluded collective thread.
          try:
              _,ctx=http('https://thecolony.ai/api/v1/posts/a33f7328-cb33-4e9d-acdc-6aed66d37b7f/context')
              report['collective_read_diagnostic']={'author':ctx.get('author',{}).get('username'),'top_level_title':ctx.get('title'),'nested_title':ctx.get('post',{}).get('title'),'comment_count':ctx.get('comment_count'),'comments_returned':len(ctx.get('comments',[])),'no_new_post_attempted':True}
          except Exception as exc:report['collective_read_diagnostic']={'error_type':type(exc).__name__,'no_new_post_attempted':True}
          report['finished_at']=datetime.now(timezone.utc).isoformat()
          print(put('reports/neighbor-conversations/cae-followup-'+RUN+'.json',report))
          print(json.dumps({'publication_verified':report['reply'].get('publication_verified',False),'message_id':report['reply'].get('message_id')}))
          PY
