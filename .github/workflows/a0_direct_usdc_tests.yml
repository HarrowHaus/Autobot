name: A0 direct USDC collector tests

on:
  push:
    paths:
      - 'swarmbrain/direct_usdc.py'
      - 'tests/test_direct_usdc.py'
      - '.github/workflows/a0_direct_usdc_*.yml'
  pull_request:
    paths:
      - 'swarmbrain/direct_usdc.py'
      - 'tests/test_direct_usdc.py'
      - '.github/workflows/a0_direct_usdc_*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_direct_usdc