name: Detect Cloudflare deploy auth
on:
  push:
    paths:
      - '.github/workflows/a0_cloudflare_auth_detect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          node - <<'NODE'
          const yes=v=>Boolean((v||'').trim());
          console.log(JSON.stringify({
            CLOUDFLARE_API_TOKEN: yes(process.env.CLOUDFLARE_API_TOKEN),
            CLOUDFLARE_ACCOUNT_ID: yes(process.env.CLOUDFLARE_ACCOUNT_ID),
            CF_API_TOKEN: yes(process.env.CF_API_TOKEN),
            CF_ACCOUNT_ID: yes(process.env.CF_ACCOUNT_ID)
          }));
          NODE
