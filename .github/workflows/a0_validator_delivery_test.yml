name: A0 buyer validator delivery tests
on:
  push:
    branches: ['revenue/clawlancer-validator-20260924']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install declared validator dependency
        run: python -m pip install -r buyer-deliverables/clawlancer-profile-validator/requirements.txt
      - name: Run exact published buyer-deliverable tests
        working-directory: buyer-deliverables/clawlancer-profile-validator
        run: |
          python -m unittest -v
          python validate_profile.py example.json
