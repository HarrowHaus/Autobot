name: SwarmBrain peer tasks
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: 'Public task JSON: connect, request, poll, or route'
        required: true
        default: '{"mode":"route","query":"memory discovery"}'
permissions:
  contents: write
concurrency:
  group: swarmbrain-peer-state
  cancel-in-progress: false
jobs:
  run-peer-tasks:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'SwarmBrain task:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test protocol and persistence logic
        run: python3 -m unittest discover -s tests -v
      - name: Perform the requested public peer operation
        run: python3 swarmbrain/peer_control.py
      - name: Preserve peer graph, task IDs and response receipts
        if: always()
        shell: bash
        run: |
          git config user.name 'SwarmBrain-Harrow'
          git config user.email '285251944+HarrowHaus@users.noreply.github.com'
          for path in data/mesh-state.json data/graph.json reports/peer-cards reports/task-receipts reports/runtime-latest.json reports/runtime-latest.md; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SwarmBrain peer responses and task history [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swarmbrain-peer-state
          path: |
            data/mesh-state.json
            data/graph.json
            reports/runtime-latest.*
            reports/peer-cards/
            reports/task-receipts/
          retention-days: 14
