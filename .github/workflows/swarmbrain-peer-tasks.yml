name: SwarmBrain peer tasks
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      job:
        description: 'Public task JSON: connect, request, poll, or route'
        required: true
        default: '{"mode":"route","query":"memory discovery"}'
permissions:
  contents: write
  issues: write
concurrency:
  group: swarmbrain-peer-state
  cancel-in-progress: false
jobs:
  run-peer-tasks:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'SwarmBrain task:')) ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, 'SwarmBrain job:') &&
       (github.event.comment.user.login == github.repository_owner ||
        github.event.comment.user.login == 'KungFury87'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATE_BRANCH: ${{ github.event.repository.default_branch }}
      SWARMBRAIN_TRUSTED_COMMENTERS: ${{ github.repository_owner }},KungFury87
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test protocol, bridge, economy, and persistence logic
        run: python3 -m unittest discover -s tests -v
      - name: Perform the requested public peer operation
        run: python3 swarmbrain/peer_control.py
      - name: Preserve peer graph, task IDs and response receipts
        if: always()
        shell: bash
        run: |
          git config user.name 'SwarmBrain-Harrow'
          git config user.email '285251944+HarrowHaus@users.noreply.github.com'
          for path in data/mesh-state.json data/graph.json reports/peer-cards reports/task-receipts reports/runtime-latest.json reports/runtime-latest.md; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SwarmBrain peer responses and task history [skip ci]'
            git push origin "HEAD:${STATE_BRANCH}"
          fi
      - name: Post automatic issue result
        if: always() && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 swarmbrain/github_bridge.py post
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swarmbrain-peer-state
          path: |
            data/mesh-state.json
            data/graph.json
            reports/runtime-latest.*
            reports/peer-cards/
            reports/task-receipts/
          retention-days: 14
